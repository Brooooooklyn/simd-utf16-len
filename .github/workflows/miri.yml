name: Miri

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  miri:
    name: Miri (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      # Target choice: aarch64 host Miri cannot run the NEON kernel at all —
      # vaddlvq_u8 lowers to llvm.aarch64.neon.uaddlv, which has no Miri
      # shim (re-verified on nightly 2026-10-07: "can't call LLVM intrinsic
      # llvm.aarch64.neon.uaddlv.i32.v16i8" aborts the suite) — while the
      # x86_64 SSE2/AVX2 kernels are fully interpretable, so Miri interprets
      # the linux target (no native code runs under Miri; the triple need
      # not match the host).
      #
      # RUSTFLAGS: Miri's cpuid shim reports AVX2 only with +avx2, so without
      # it only the SSE2 kernel would ever run.
      #
      # MIRIFLAGS: -Zmiri-disable-isolation lets the kernel-availability test
      # read SIMD_UTF16_LEN_EXPECT_KERNELS, so a future Miri that stops
      # covering SSE2 or AVX2 fails loudly instead of silently running less
      # kernel code.
      MIRIFLAGS: -Zmiri-disable-isolation
      RUSTFLAGS: -C target-feature=+avx2
      SIMD_UTF16_LEN_EXPECT_KERNELS: sse2,avx2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      # Validated on an Apple M5 Max with cargo 1.101.0-nightly (2026-10-07):
      # both commands green, ~2 minutes of interpretation once the sysroot is
      # cached. The lib suite skips only non_ascii_after_ascii_prefix: its
      # ~78k kernel invocations exceed 15 minutes under interpretation, and
      # its boundary coverage overlaps tests/exact_allocations.rs, which
      # sweeps every length 0..=256 plus every kernel's batch boundary
      # against exactly-sized allocations in seconds. The skipped test still
      # runs in ci.yml and under the ASan workflow at native speed.
      - run: cargo miri test --target x86_64-unknown-linux-gnu --lib -- --skip non_ascii_after_ascii_prefix
      - run: cargo miri test --target x86_64-unknown-linux-gnu --test exact_allocations
